[package]
name = "mangix"
version = "1.0.5"
edition = "2021"
rust-version = "1.77"
description = "A keyboard-driven comic reader for CBZ/CBR archives and image folders"

[dependencies]
# Slint's own build script pulls in a full-featured copy of `image`, but this
# slim one is what ends up in the binary.
slint = { version = "1.8", default-features = false, features = [
    "compat-1-2",
    "std",
    "backend-winit",
    "renderer-femtovg",
    # Exposes the native window handle, which the file-drop hook needs.
    "raw-window-handle-06",
] }
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "webp",
    "bmp",
] }
# deflate only: "bzip2" would drag in a C library almost no CBZ uses.
zip = { version = "2", default-features = false, features = ["deflate"] }
rfd = "0.15"
anyhow = "1"
# PDF rendering. Bound at runtime to a pdfium library sitting next to the
# executable, so there is no C toolchain here and no library at build time.
pdfium-render = { version = "0.8", features = ["thread_safe"] }

# Alternative renderers. FemtoVG needs working OpenGL; if pages draw slowly,
# try `--features skia` with SLINT_BACKEND=winit-skia.
[features]
skia = ["slint/renderer-skia"]
software = ["slint/renderer-software"]

[build-dependencies]
slint-build = "1.8"

# Embeds the icon into the exe. Build scripts are compiled for the host, so
# this is selected when building on Windows and absent everywhere else.
# Slint 1.17 has DragArea/DropArea, but only for drags inside the application;
# accepting files from Explorer is still being built upstream in winit. So the
# window is hooked directly instead.
[target.'cfg(windows)'.dependencies]
# windows-sys, not windows: raw FFI declarations rather than generated wrapper
# types. Same five calls, a fraction of the code to compile and link.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    # RevokeDragDrop: winit registers its own OLE drop target on the window and
    # that suppresses WM_DROPFILES, so it has to be revoked before the shell's
    # DragAcceptFiles path will fire. See src/drop.rs.
    "Win32_System_Ole",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
] }
raw-window-handle = "0.6"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
