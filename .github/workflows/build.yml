name: build

# Runs only for version tags. Push v1.0.0 and it builds, packages and drafts
# a release; ordinary commits and pull requests are left alone.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Fetching crates is the slow part of a cold Windows runner.
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  windows:
    runs-on: windows-latest
    # Creating a release and generating its notes both write to the repo.
    # GITHUB_TOKEN is read-only by default, which fails with
    # "Resource not accessible by integration".
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Keyed on Cargo.lock so a dependency change invalidates it. Slint is a
      # large tree; this is the difference between a two-minute build and a
      # twenty-minute one.
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      # PDF support is optional at runtime, but the release should ship it.
      # The assets are .tgz for every platform, including Windows; tar is
      # built into windows-latest and unpacks them fine.
      - name: Fetch PDFium
        run: |
          $url = "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-win-x64.tgz"
          Invoke-WebRequest -Uri $url -OutFile pdfium.tgz
          New-Item -ItemType Directory -Force -Path pdfium | Out-Null
          tar -xzf pdfium.tgz -C pdfium
          Copy-Item pdfium\bin\pdfium.dll installer\pdfium.dll

      - name: Stage the installer inputs
        run: Copy-Item target\release\mangix.exe installer\mangix.exe

      # NSIS is not on the runner image; Chocolatey is.
      - name: Install NSIS
        run: choco install nsis -y --no-progress

      # choco does not put makensis on PATH for the current step, so call it
      # by its install path.
      - name: Build the installer
        working-directory: installer
        run: |
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            $makensis = "C:\Program Files\NSIS\makensis.exe"
          }
          & $makensis mangix.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package the portable zip
        run: |
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item target\release\mangix.exe portable\mangix.exe
          Copy-Item installer\pdfium.dll portable\pdfium.dll
          Compress-Archive -Path portable\* -DestinationPath "Mangix portable.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: mangix-windows
          path: |
            installer/Mangix-*-setup.exe
            Mangix portable.zip
          if-no-files-found: error

      # Still guarded, because workflow_dispatch can run this without a tag.
      # The installer carries both files; the zip is for anyone who would
      # rather not run an installer.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: false
          files: |
            installer/Mangix-*-setup.exe
            Mangix portable.zip

  # Runs alongside the release build so a tag is never published from a tree
  # that does not lint or test cleanly.
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install the GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libxkbcommon-dev \
                                  libxcb1-dev libx11-dev libgl1-mesa-dev
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test
