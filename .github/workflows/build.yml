name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Fetching crates is the slow part of a cold Windows runner.
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Keyed on Cargo.lock so a dependency change invalidates it. Slint is a
      # large tree; this is the difference between a two-minute build and a
      # twenty-minute one.
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      # PDF support is optional at runtime, but the release should ship it.
      - name: Fetch PDFium
        run: |
          $url = "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-win-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile pdfium.zip
          Expand-Archive pdfium.zip -DestinationPath pdfium
          Copy-Item pdfium\bin\pdfium.dll installer\pdfium.dll
          Copy-Item pdfium\LICENSE pdfium-LICENSE.txt

      - name: Stage the installer inputs
        run: Copy-Item target\release\mangix.exe installer\mangix.exe

      # NSIS ships with windows-latest, so there is nothing to install.
      - name: Build the installer
        working-directory: installer
        run: makensis mangix.nsi

      - uses: actions/upload-artifact@v4
        with:
          name: mangix-windows
          path: |
            installer/Mangix-*-setup.exe
            target/release/mangix.exe
            installer/pdfium.dll
            THIRD-PARTY.md
            pdfium-LICENSE.txt
          if-no-files-found: error

      # Only on a tag. The installer carries both files; the loose exe and DLL
      # are there for anyone who would rather not run an installer.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            installer/Mangix-*-setup.exe
            target/release/mangix.exe
            installer/pdfium.dll
            THIRD-PARTY.md
            pdfium-LICENSE.txt

  # Catches anything Windows-only code paths would hide, and keeps the
  # cross-platform parts honest.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install the GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libxkbcommon-dev \
                                  libxcb1-dev libx11-dev libgl1-mesa-dev
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test
